<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ShareTrack · Facebook</title><link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"></head><body><header><a class="brand" href="/">◉ ShareTrack</a>{% if session.get('logged_in') %}<form method="post" action="/logout" class="logout-form"><input type="hidden" name="_csrf" value="{{ csrf_token() }}"><button class="logout">Đăng xuất</button></form>{% endif %}</header><main>{% with messages=get_flashed_messages(with_categories=true) %}{% for category,message in messages %}<div class="flash {{category}}">{{message}}</div>{% endfor %}{% endwith %}{% block content %}{% endblock %}</main><footer>ShareTrack · Công cụ quản lý chiến dịch chia sẻ công khai</footer></body></html>
