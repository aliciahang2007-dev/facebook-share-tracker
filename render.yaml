services:
  - type: web
    name: facebook-share-tracker
    runtime: docker
    plan: starter
    healthCheckPath: /health
    disk:
      name: sharetracker-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_PATH
        value: /var/data/tracker.db
      - key: COOKIE_SECURE
        value: "1"
      - key: FLASK_SECRET_KEY
        generateValue: true
      - key: ADMIN_PASSWORD
        sync: false
      - key: META_PAGE_ACCESS_TOKEN
        sync: false
      - key: META_GRAPH_VERSION
        value: v27.0
